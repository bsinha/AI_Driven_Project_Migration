[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "migrate_framework"
version = "0.1.0"
description = "Context Atlas — evidence-led estate assessment pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "streamlit>=1.32",
    "openai>=1.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
migrate-framework = "migrate_framework.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["migrate_framework*"]

[tool.setuptools.package-data]
migrate_framework = ["ui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
