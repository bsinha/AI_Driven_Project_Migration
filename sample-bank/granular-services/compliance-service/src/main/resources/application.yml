server:
  port: 8115

spring:
  application:
    name: compliance-service
  datasource:
    url: jdbc:mysql://localhost:3306/compliance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update

eurosa:
  downstream:
    customer-identity-service: http://localhost:8101
    payment-initiation-service: http://localhost:8109
